<!doctype html>
<html lang="pt-BR">
  <head>
    <script>
      // Automatically redirect to have a trailing slash on GitHub Pages
      // to guarantee relative assets in subdirectories (like ./assets/...) load correctly.
      if (window.location.hostname.endsWith('.github.io')) {
        const path = window.location.pathname;
        if (path && !path.endsWith('/')) {
          const parts = path.split('/').filter(Boolean);
          if (parts.length === 1) { // /your-repo -> /your-repo/
            window.location.replace(window.location.protocol + '//' + window.location.host + path + '/');
          }
        }
      }
    </script>
